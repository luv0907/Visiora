<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VISIORA — Ohm's Law Virtual Physics Lab (Unity 3D)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A192F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FAF8F5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #050B14;
      display: none;
    }
    .unity-standby-card {
      max-width: 520px;
      padding: 36px 32px;
      background: #FAF8F5;
      color: #0A192F;
      border: 1px solid rgba(0, 43, 102, 0.2);
      border-top: 4px solid #002B66;
      box-shadow: 0 20px 48px rgba(0, 43, 102, 0.25);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      background: rgba(0, 43, 102, 0.08);
      color: #002B66;
      border: 1px solid rgba(0, 43, 102, 0.2);
      margin-bottom: 16px;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #002B66;
      margin-bottom: 10px;
    }
    p {
      font-size: 13.5px;
      color: #4A5568;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .formula-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #002B66;
      color: #FFFFFF;
      font-family: monospace;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: #002B66;
      color: #FFFFFF;
      border: 1px solid #002B66;
    }
    .btn-primary:hover {
      background: #0A192F;
    }
    .btn-secondary {
      background: #FFFFFF;
      color: #002B66;
      border: 1px solid rgba(0, 43, 102, 0.3);
    }
    .btn-secondary:hover {
      background: #F4EFE6;
    }
    #loading-spinner {
      display: none;
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 43, 102, 0.2);
      border-top-color: #002B66;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    
    <div id="standby-card" class="unity-standby-card">
      <span class="badge">Unity 6 &bull; WebGL Engine</span>
      <h2>Ohm's Law Virtual Physics Lab</h2>
      <div class="formula-pill">V = I &middot; R</div>
      <p>
        School-ready 3D circuit bench with realistic wiring, dual-range analog voltmeter and ammeter, wire-wound rheostat, and 5-point CBSE observation ledger.
      </p>
      <div id="loading-spinner"></div>
      <div class="actions">
        <button class="btn btn-primary" onclick="launchInTopWindow('/sim')">
          Launch 3D Physics Simulator
        </button>
        <button class="btn btn-secondary" onclick="launchInTopWindow('/')">
          Back to Home
        </button>
      </div>
    </div>
  </div>

  <script>
    function launchInTopWindow(path) {
      if (window.top && window.top !== window) {
        window.top.location.href = path;
      } else {
        window.location.href = path;
      }
    }

    // Check if real Unity WebGL build exists
    const buildLoaderScript = 'Build/virtual-lab.loader.js';
    const testScript = document.createElement('script');
    testScript.src = buildLoaderScript;
    testScript.onload = () => {
      // Unity loader is present! Initialize Unity Canvas
      const canvas = document.querySelector('#unity-canvas');
      const card = document.querySelector('#standby-card');
      const spinner = document.querySelector('#loading-spinner');
      if (spinner) spinner.style.display = 'block';

      createUnityInstance(canvas, {
        dataUrl: "Build/virtual-lab.data",
        frameworkUrl: "Build/virtual-lab.framework.js",
        codeUrl: "Build/virtual-lab.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Visora Education",
        productName: "Visora Virtual Lab",
        productVersion: "1.0",
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        if (card) card.style.display = 'none';
        if (canvas) canvas.style.display = 'block';
        if (window.parent) {
          window.parent.postMessage({ type: 'UNITY_LAB_READY' }, '*');
        }
      }).catch((err) => {
        console.warn('Unity WebGL initialization error:', err);
      });
    };
    testScript.onerror = () => {
      // Standby card stays visible; no recursive SPA routing can ever occur
      console.log('Unity WebGL build files not yet deployed to /virtual-lab/Build/. Serving standby view.');
    };
    document.body.appendChild(testScript);
  </script>
</body>
</html>
