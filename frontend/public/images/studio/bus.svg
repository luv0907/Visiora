  <circle cx="50" cy="70" r="12" fill="#16181D"/>
  <circle cx="184" cy="70" r="12" fill="#16181D"/>
  <circle cx="50" cy="70" r="4.5" fill="#fff" stroke="none"/>
  <circle cx="184" cy="70" r="4.5" fill="#fff" stroke="none"/>
</svg>
